name: Backend Validation

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-validation.yml"
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - ".github/workflows/backend-validation.yml"

permissions:
  contents: read

jobs:
  backend-validation:
    name: Backend tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: |
            backend/**/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run backend tests
        working-directory: backend
        run: ./gradlew test

      - name: Publish test reports for diagnosis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/build/test-results/test
          if-no-files-found: ignore
          retention-days: 1

      - name: Build backend
        working-directory: backend
        run: ./gradlew clean build

      - name: Publish backend JAR for exact-head API QA
        uses: actions/upload-artifact@v7
        with:
          name: backend-application
          path: backend/build/libs/meeting-automation-backend-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 1
